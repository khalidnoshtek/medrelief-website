# Publish the public site to medrelief.co.in (S3 + CloudFront in the Medrelief
# prod AWS account) on every push to main. The role is defined in medlab
# infra/envs/prod (aws_iam_role.website_deploy) and trusts only this repo's main.
# Only the public site goes out; review pages (branding.html, assets/branding/)
# stay on GitHub Pages.
name: Deploy website (medrelief.co.in)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.WEBSITE_BUCKET }}
      DISTRIBUTION: ${{ vars.WEBSITE_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_WEBSITE_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Stage the public files
        run: |
          set -euo pipefail
          mkdir -p out/assets/logo
          cp index.html chat.js config.js i18n.js analytics.js privacy.html terms.html links.html out/
          # /links (Instagram bio): the bucket is a private S3 origin with no index-document
          # rewrite, and CloudFront answers a missing key with the home page, so the page also
          # goes up under the extensionless key "links".
          cp links.html out/links
          cp assets/qr-patient-app.svg out/assets/
          cp assets/logo/* out/assets/logo/
          find out -type f | sort

      - name: Upload
        run: |
          set -euo pipefail
          # Pages and scripts revalidate on every load (scripts carry ?v= stamps);
          # logos and the QR may be cached for a day.
          aws s3 sync out/ "s3://$BUCKET/" --delete --exclude "assets/*" --exclude "links" \
            --cache-control "public, max-age=0, must-revalidate"
          # "links" has no extension, so its type is set here (CloudFront sends nosniff).
          # Excluded from the sync above, so --delete never removes it between deploys.
          aws s3 cp out/links "s3://$BUCKET/links" --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=0, must-revalidate"
          aws s3 sync out/assets/ "s3://$BUCKET/assets/" --delete \
            --cache-control "public, max-age=86400"

      - name: Refresh CloudFront
        run: |
          set -euo pipefail
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"
          echo "Live: https://medrelief.co.in/"
